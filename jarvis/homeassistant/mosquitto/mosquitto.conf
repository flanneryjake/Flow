# Mosquitto broker for Jarvis (runs next to Home Assistant in WSL2 Docker on homebase).
# Reached over Tailscale only; every client (HA, HASS.Agent, the Pi, the Linux agent) logs in.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
allow_anonymous false
# Create once inside the container:  mosquitto_passwd -c /mosquitto/config/passwd jarvis
password_file /mosquitto/config/passwd
