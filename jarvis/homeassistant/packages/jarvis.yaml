# Jarvis package for Home Assistant. Put this file in <HA config>/packages/ and make sure
# configuration.yaml has:
#   homeassistant:
#     packages: !include_dir_named packages
# Secret it needs in secrets.yaml: notion_auth: "Bearer ntn_..." (the same Notion token the watchdog uses).

# --- Notion: approvals waiting + Machine Health rows ---------------------------------------
rest:
  - resource: https://api.notion.com/v1/databases/7c1c59e927644dfba461c88a67dbd32c/query
    method: POST
    headers:
      Authorization: !secret notion_auth
      Notion-Version: "2022-06-28"
      Content-Type: application/json
    payload: >-
      {"page_size": 100, "filter": {"and": [
        {"property": "Type", "select": {"equals": "Approval"}},
        {"property": "Status", "select": {"equals": "Inbox"}}]}}
    scan_interval: 300
    sensor:
      - name: Jarvis approvals waiting
        unique_id: jarvis_approvals_waiting
        icon: mdi:inbox-arrow-down
        value_template: "{{ value_json.results | length }}"
        json_attributes_path: "$"
        json_attributes: [results]

  - resource: https://api.notion.com/v1/pages/3ea11c3639af816bbd70fd523fe28b81
    headers: &notion_get
      Authorization: !secret notion_auth
      Notion-Version: "2022-06-28"
    scan_interval: 300
    sensor:
      - name: Homebase worker
        unique_id: jarvis_homebase_worker
        icon: mdi:robot-industrial
        value_template: "{{ value_json.properties.Worker.select.name | default('Unknown') }}"
        json_attributes_path: "$.properties"
        json_attributes: [Snapshot]
      - name: Homebase alert
        unique_id: jarvis_homebase_alert
        icon: mdi:alert-circle-outline
        value_template: >-
          {% set t = value_json.properties.Alert.rich_text | map(attribute='plain_text') | join %}
          {{ (t or 'OK')[:250] }}
      - name: Homebase last check-in
        unique_id: jarvis_homebase_checkin
        device_class: timestamp
        value_template: "{{ value_json.properties['Last check-in'].date.start }}"

  - resource: https://api.notion.com/v1/pages/3ea11c3639af81b5af25cb91f2f88cdd
    headers: *notion_get
    scan_interval: 300
    sensor:
      - name: Rig worker
        unique_id: jarvis_rig_worker
        icon: mdi:robot-industrial
        value_template: "{{ value_json.properties.Worker.select.name | default('Unknown') }}"
        json_attributes_path: "$.properties"
        json_attributes: [Snapshot]
      - name: Rig alert
        unique_id: jarvis_rig_alert
        icon: mdi:alert-circle-outline
        value_template: >-
          {% set t = value_json.properties.Alert.rich_text | map(attribute='plain_text') | join %}
          {{ (t or 'OK')[:250] }}
      - name: Rig last check-in
        unique_id: jarvis_rig_checkin
        device_class: timestamp
        value_template: "{{ value_json.properties['Last check-in'].date.start }}"

# --- Wake the rig through the hub (same endpoint the Worker uses) --------------------------
rest_command:
  jarvis_wake_rig:
    url: http://100.90.201.22:8765/wake/rig
    method: GET
    timeout: 20

script:
  jarvis_wake_rig:
    alias: Wake the rig
    icon: mdi:power
    sequence:
      - action: rest_command.jarvis_wake_rig

# --- Jarvis Pi voice assistant (publishes over MQTT) ---------------------------------------
# The Pi publishes jarvis/pi/status = online/offline (retained, with an MQTT last will) and
# jarvis/pi/voice/last = {"text": "...", "reply": "...", "at": "ISO time"} after each command.
mqtt:
  binary_sensor:
    - name: Jarvis Pi online
      unique_id: jarvis_pi_online
      state_topic: jarvis/pi/status
      payload_on: online
      payload_off: offline
      device_class: connectivity
  sensor:
    - name: Jarvis last voice command
      unique_id: jarvis_pi_last_voice
      icon: mdi:microphone-message
      state_topic: jarvis/pi/voice/last
      value_template: "{{ (value_json.text | default(''))[:250] }}"
      json_attributes_topic: jarvis/pi/voice/last

# --- Phone alert when a machine goes red --------------------------------------------------
automation:
  - id: jarvis_machine_alert_to_phone
    alias: Jarvis machine alert to phone
    triggers:
      - trigger: state
        entity_id: [sensor.homebase_alert, sensor.rig_alert]
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['OK', 'unknown', 'unavailable', 'Remote Control restarted'] }}"
    actions:
      - action: notify.notify
        data:
          title: "Jarvis: {{ trigger.to_state.name }}"
          message: "{{ trigger.to_state.state }}"
