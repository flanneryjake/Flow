# ESPHome firmware for the spool scale: ESP32 + HX711 + 5 kg bar load cell under the spool holder.
# Flash once over USB from any PC:  pip install esphome ; esphome run spool-scale.yaml
# secrets.yaml next to this file needs wifi_ssid, wifi_password and api_key (any 32-byte base64 string).
esphome:
  name: spool-scale
  friendly_name: Spool scale

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

logger:

sensor:
  - platform: hx711
    name: Weight
    id: spool_weight
    dout_pin: GPIO16
    clk_pin: GPIO4
    gain: 128
    update_interval: 5s
    unit_of_measurement: g
    accuracy_decimals: 0
    filters:
      - median:          # drop single bad reads
          window_size: 5
          send_every: 3
      # Two-point calibration, see README: raw reading with the empty holder -> 0 g,
      # raw reading with a known weight on it -> that weight. Replace both raw numbers.
      - calibrate_linear:
          - 120000 -> 0
          - 520000 -> 1000
      - sliding_window_moving_average:
          window_size: 6
          send_every: 6
